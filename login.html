
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Learnora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">Learnora.</a>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue your learning journey.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input class="field" id="email" type="email"
          placeholder="you@example.com" autocomplete="email" required>

        <label for="password">Password</label>
        <input class="field" id="password" type="password"
          placeholder="Enter your password"
          autocomplete="current-password" required>

        <button class="btn" id="loginButton" type="submit">Login</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <p class="auth-link">
        Don't have an account? <a href="register.html" style="color:#1a73e8">Create account</a>
      </p>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
 
<div class="google-login">
  <h2>Welcome to Learnora</h2>
  <p>Sign in with your Google Account</p>

  <div id="googleButton"></div>

  <p id="loginStatus" aria-live="polite"></p>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";

const GOOGLE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx874LBndOfYlg3Pp-v6gqSCA5mleN_k8_9o-A4UDO_9UiTNEy1KLN7IiCVdlEUMHsW/exec";

window.addEventListener("load", () => {
  const checkGoogle = setInterval(() => {
    if (!window.google?.accounts?.id) return;

    clearInterval(checkGoogle);

    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleLogin
    });

    google.accounts.id.renderButton(
      document.getElementById("googleButton"),
      {
        theme: "outline",
        size: "large",
        shape: "rectangular",
        text: "continue_with",
        width: 280
      }
    );
  }, 200);
});

async function handleGoogleLogin(response) {
  const status = document.getElementById("loginStatus");
  status.textContent = "Verifying your Google Account...";

  try {
    const result = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "googleLogin",
        credential: response.credential
      })
    });

    const data = await result.json();

    if (!data.success) {
      throw new Error(data.message || "Login failed.");
    }

    // Keep the Google ID token for authenticated requests.
    // Do not treat an email stored in localStorage as proof of identity.
    sessionStorage.setItem(
      "learnora_google_credential",
      response.credential
    );

    status.textContent = "Login successful!";

    window.location.href = "dashboard.html";

  } catch (error) {
    console.error(error);
    status.textContent =
      "Login could not be completed. Check the Apps Script deployment and connection.";
  }
}
</script>


</body>
</html>
